:root{--ink:#152822;--green:#183d31;--lime:#d1f77d;--paper:#f5f5ef;--muted:#78847a;--line:#e1e5dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button,a{ -webkit-tap-highlight-color:transparent}header{background:#101f19;color:white;padding:0 5%;height:86px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.mark{background:var(--lime);color:var(--ink);border-radius:50%;font-size:26px;width:44px;height:44px;display:grid;place-items:center}.brand strong{display:block;font-size:20px;letter-spacing:-1px}.brand small{font-size:9px;letter-spacing:2.8px;color:#b1bfb5}nav{display:flex;gap:8px}nav button{border:0;background:none;color:#aab8af;padding:13px 16px;border-radius:8px;font-weight:600}nav button.active{color:var(--lime);background:#26392e}.btn{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:11px 18px;font-weight:700}.btn.primary{background:var(--lime);border-color:var(--lime)}.btn.dark{background:var(--ink);color:white;border-color:var(--ink)}.demo{background:#e9eeda;padding:9px 5%;font-size:12px;display:flex;justify-content:space-between;gap:10px}.demo a{color:inherit}main{max-width:1230px;margin:auto;padding:32px 28px 65px}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:2px;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}.toolbar select{max-width:250px;background:white;border:1px solid var(--line);padding:11px;border-radius:8px}.hero{background:var(--green);color:white;border-radius:16px;padding:35px 40px;display:grid;grid-template-columns:1.35fr 1fr;gap:25px;position:relative;overflow:hidden}.hero .eyebrow{color:var(--lime)}h1,h2,h3,p{margin-top:0}h1{font:800 clamp(40px,5vw,64px)/.99 'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;letter-spacing:-1px;margin:18px 0}h1 em{font-style:normal;color:var(--lime)}.hero p{color:#c4d3c8;font-size:13px;line-height:1.8;max-width:420px}.deadline{align-self:center;justify-self:end;width:100%;max-width:340px;border:1px solid #4c6858;border-radius:12px;background:#214a3c;padding:24px}.deadline small{color:#c9d6c8}.countdown{display:flex;gap:24px;font:700 34px 'Barlow Condensed',sans-serif;margin:15px 0}.countdown span small{display:block;font:9px 'DM Sans',sans-serif;letter-spacing:2px;margin-top:5px}.pill{display:inline-block;border-radius:20px;padding:6px 10px;font-size:10px;font-weight:700;background:#eef3e6;color:#527039}.hero .pill{background:#36583f;color:var(--lime)}.stats{display:grid;grid-template-columns:repeat(4,1fr);background:white;border:1px solid var(--line);border-radius:12px;margin:20px 0 32px;padding:22px 0}.stat{padding:0 26px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:24px;display:block;margin-top:5px;letter-spacing:-1px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:25px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.section-title h2{font-size:19px;margin:0;letter-spacing:-.5px}.section-title small{color:var(--muted)}.match{background:white;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:11px}.match-head{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.4px;margin-bottom:13px}.versus{display:grid;grid-template-columns:1fr 160px 1fr;align-items:center;gap:12px}.team{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}.team.away{justify-content:flex-end;text-align:right}.badge{flex-shrink:0;width:32px;height:38px;display:grid;place-items:center;background:var(--team,#213d67);color:white;border-radius:6px 6px 14px 14px;font-size:10px;font-weight:800;border:2px solid #ffffff;box-shadow:0 0 0 1px #e4e7de}.choices{display:flex;gap:5px}.choice{width:50px;height:36px;background:#f6f7f2;border:1px solid var(--line);border-radius:6px;color:#728174;font-weight:700}.choice.selected{background:var(--ink);color:var(--lime);border-color:var(--ink)}.score{text-align:center;font-size:22px;font-weight:700;letter-spacing:4px}.match-foot{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}.card{background:white;border:1px solid var(--line);padding:22px;border-radius:12px;margin-bottom:18px}.card h3{font-size:15px;margin-bottom:8px}.muted{color:var(--muted);font-size:12px;line-height:1.7}.rank-row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0e9}.rank-row:last-child{border:0}.rank-row strong:last-child{margin-left:auto}.avatar{width:33px;height:33px;background:#edf1e4;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}.rank-row.first .avatar{background:var(--lime)}.rank-row .name{font-size:12px;font-weight:600}.rank-row .position{font-size:11px;width:12px;color:var(--muted)}.savebar{position:sticky;bottom:16px;background:var(--ink);color:white;border-radius:10px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 25px #15282222;margin-top:20px}.savebar small{display:block;color:#a5b9aa;font-size:10px;margin-top:4px}.rules{background:#e9eedf;border:0}.rules ol{padding-left:18px;line-height:1.9;font-size:12px}.progress{height:5px;background:#ecf0e4;border-radius:9px;overflow:hidden;margin:17px 0}.progress i{display:block;background:#a9cd57;height:100%}.champion{background:var(--lime);padding:24px;border-radius:12px;margin:20px 0}.champion h2{margin:8px 0}.table-wrap{overflow:auto;background:white;border-radius:12px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:17px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:10px;letter-spacing:1px;color:var(--muted)}.history-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.history-grid .card{cursor:pointer}.empty{padding:50px 20px;text-align:center;background:white;border:1px dashed var(--line);border-radius:12px}.full{width:100%}.fields{display:grid;gap:12px}.fields label{font-size:12px;font-weight:600}.fields input,.fields textarea,.fields select{width:100%;padding:12px;border-radius:7px;border:1px solid #ccd5c9;margin-top:7px;background:white}.fields textarea{height:140px}.form-actions{display:flex;gap:10px;margin-top:10px}dialog{width:min(460px,94vw);border:0;border-radius:16px;padding:30px;box-shadow:0 24px 90px #0004}dialog::backdrop{background:#0d211ab3;backdrop-filter:blur(4px)}dialog .close{float:right;background:none;border:0;font-size:24px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#152822;color:white;padding:14px 24px;border-radius:10px;display:none;z-index:10;max-width:90vw}footer{border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:25px 0;color:var(--muted);font-size:10px;margin-top:45px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.admin-match{display:grid;grid-template-columns:1fr 65px 65px 110px auto;gap:8px;align-items:center;margin:12px 0}.admin-match input,.admin-match select{padding:7px;width:100%}.live{color:#be6932}.note{font-size:11px;padding:10px;background:#f0f4e9;border-radius:6px}@media(max-width:850px){header{padding:15px 20px;height:auto;flex-wrap:wrap;gap:14px}nav{order:3;width:100%;justify-content:center}nav button{padding:10px;font-size:12px}.layout{grid-template-columns:1fr}.hero{padding:26px;grid-template-columns:1fr}.deadline{max-width:none;justify-self:start}.countdown{margin:10px 0}.stats{padding:17px 0}.stat{padding:0 14px}.stat strong{font-size:20px}.history-grid{grid-template-columns:1fr 1fr}.admin-grid{grid-temp </style><script>window.QUINIELA_CONFIG={supabaseUrl:"",supabaseAnonKey:"",title:"La Banda"};</script></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script type="module">const outcome = m => m.status === 'finished' && Number.isInteger(m.home_score) && Number.isInteger(m.away_score) ? (m.home_score > m.away_score ? 'L' : m.home_score < m.away_score ? 'V' : 'E') : null;
const closed = (r, now = Date.now()) => now >= Date.parse(r.deadline);
const complete = matches => matches.length > 0 && matches.every(m => ['finished','cancelled'].includes(m.status));
function standings(profiles, picks, matches) {
 return profiles.filter(p=>picks.some(x=>x.user_id===p.id && matches.some(m=>m.id===x.match_id))).map(p=>({...p,points:picks.filter(x=>x.user_id===p.id && matches.some(m=>m.id===x.match_id && outcome(m)===x.choice)).length})).sort((a,b)=>b.points-a.points || a.name.localeCompare(b.name));
}
const winners = rows => rows.length ? rows.filter(r=>r.points === rows[0].points) : [];
const e = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const cfg=window.QUINIELA_CONFIG, demo=!cfg.supabaseUrl||!cfg.supabaseAnonKey;
let session=JSON.parse(localStorage.getItem('lb-session')||'null'), user=null, data={rounds:[],matches:[],profiles:[],picks:[]}, tab='jornada', selected=null, draft={}, dirty=false, busy=false;
const $=s=>document.querySelector(s), fmt=d=>new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(d));
const colors={'América':'#c19a30','Guadalajara':'#bb3540','Cruz Azul':'#245dc0','Pumas':'#b89949','Tigres':'#c99b21','Monterrey':'#213b63','Toluca':'#c23738','Pachuca':'#285378','León':'#34805c','Atlas':'#972b39','Santos':'#358364','Puebla':'#699cbe'};
function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',5000)}
async function api(path,{method='GET',body,auth=false}={}){const r=await fetch(cfg.supabaseUrl+(auth?'/auth/v1/':'/rest/v1/')+path,{method,headers:{apikey:cfg.supabaseAnonKey,Authorization:`Bearer ${session?.access_token||cfg.supabaseAnonKey}`,'Content-Type':'application/json',Prefer:'return=representation'},body:body===undefined?undefined:JSON.stringify(body)});const result=await r.json().catch(()=>null);if(!r.ok)throw Error(result?.message||result?.msg||result?.error_description||'No se pudo conectar. Intenta de nuevo.');return result}
async function allRows(path){let rows=[];for(let offset=0;;offset+=1000){const page=await api(path+'&limit=1000&offset='+offset);rows.push(...page);if(page.length<1000)return rows}}
async function refreshToken(){if(session&&session.expires_at*1000<Date.now()+60000){session=await api('token?grant_type=refresh_token',{auth:true,method:'POST',body:{refresh_token:session.refresh_token}});localStorage.setItem('lb-session',JSON.stringify(session))}}
function demoData(){const start=Date.now()+3*86400000;const pairs=[['América','Guadalajara'],['Tigres','Monterrey'],['Cruz Azul','Pumas'],['Toluca','Pachuca'],['León','Atlas'],['Santos','Puebla'],['Tijuana','Necaxa'],['Querétaro','Juárez'],['San Luis','Mazatlán']];const rounds=[{id:'r10',name:'Jornada 10',stage:'Regular',season:'Torneo de demostración',deadline:new Date(start-86400000).toISOString(),published:true},{id:'r9',name:'Jornada 9',stage:'Regular',season:'Torneo de demostración',deadline:new Date(start-8*86400000).toISOString(),published:true}];const matches=rounds.flatMap((r,j)=>pairs.map((p,i)=>({id:`${r.id}-${i}`,round_id:r.id,home:p[0],away:p[1],kickoff:new Date(start-j*7*86400000+i*7200000).toISOString(),status:j?'finished':'scheduled',home_score:j?(i%3):null,away_score:j?((i+1)%2):null})));const profiles=['Gandhi','Mariana','Luis','José Luis','Alex'].map((name,i)=>({id:'u'+i,name}));const picks=profiles.flatMap((p,j)=>matches.filter(m=>m.round_id==='r9').map((m,i)=>({user_id:p.id,match_id:m.id,choice:['L','E','V'][(i+j)%3]})));return {rounds,matches,profiles,picks}}
async function load(){if(demo){data=JSON.parse(localStorage.getItem('lb-demo')||'null')||demoData();user=JSON.parse(localStorage.getItem('lb-demo-user')||'null')}else{await refreshToken();const result=await Promise.all(['rounds?order=deadline.desc','matches?order=kickoff.asc','profiles?select=id,name&order=id','picks?select=user_id,match_id,choice&order=user_id,match_id'].map(p=>allRows(p)));[data.rounds,data.matches,data.profiles,data.picks]=result;user=session?data.profiles.find(p=>p.id===session.user.id):null;if(session){const admins=await api('admins?select=user_id');if(user)user.isAdmin=admins.some(x=>x.user_id===user.id)}}if(!selected)selected=data.rounds.find(r=>!closed(r))?.id||data.rounds[0]?.id;restoreDraft();render()}
function restoreDraft(){if(dirty)return;draft=Object.fromEntries(data.picks.filter(p=>p.user_id===user?.id).map(p=>[p.match_id,p.choice]))}
function round(){return data.rounds.find(r=>r.id===selected)}function matches(){return data.matches.filter(m=>m.round_id===selected)}function badge(name){return `<span class="badge" style="--team:${colors[name]||'#526753'}">${e(name.slice(0,3).toUpperCase())}</span>`}
function ranks(ms=matches()){return standings(data.profiles,data.picks,ms)}
function rankingList(rows){return rows.slice(0,5).map((p,i)=>`<div class="rank-row ${i===0?'first':''}"><span class="position">${rows.findIndex(x=>x.points===p.points)+1}</span><span class="avatar">${e(p.name.slice(0,2).toUpperCase())}</span><span class="name">${e(p.name)}</span><strong>${p.points} <small class="muted">pts</small></strong></div>`).join('')||'<p class="muted">La clasificación aparece cuando se cierra la jornada.</p>'}
function render(){const r=round(),ms=matches(),isClosed=r&&closed(r);$('#app').innerHTML=`<header><div class="brand"><span class="mark">⚽</span><div><strong>LA BANDA<span style="color:var(--lime)">.</span></strong><small>QUINIELA · LIGA MX</small></div></div><nav>${[['jornada','Mi quiniela'],['tabla','Clasificación'],['historial','Historial'],...((user?.isAdmin||demo)?[['admin','Administrar']]:[])].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}</nav><button class="btn primary" id="account">${user?e(user.name)+' ↗':'Entrar a la banda ↗'}</button></header>${demo?'<div class="demo"><span>✦ MODO DEMOSTRACIÓN · Partidos ficticios. Los cambios solo se guardan en este navegador.</span><a href="https://github.com" target="_blank" rel="noopener">Preparada para GitHub Pages ↗</a></div>':''}<main><div class="toolbar"><span class="eyebrow">TU BANDA. TU FÚTBOL. TU QUINIELA.</span><select id="round-select" aria-label="Seleccionar jornada">${data.rounds.map(x=>`<option value="${e(x.id)}" ${x.id===selected?'selected':''}>${e(x.season)} · ${e(x.name)}</option>`).join('')}</select></div>${tab==='admin'?admin():!r?'<div class="empty"><h2>La temporada está por comenzar</h2><p>El administrador publicará la primera jornada aquí.</p></div>':tab==='jornada'?jornada(r,ms,isClosed):tab==='tabla'?tableView(r,ms):history()}<footer><span>LA BANDA © ${new Date().getFullYear()} · Hecho para competir entre amigos.</span><span>El fútbol se disfruta más juntos.</span></footer></main>`;bind();tick()}
function jornada(r,ms,isClosed){const rows=ranks(),count=ms.filter(m=>draft[m.id]).length,done=ms.filter(m=>m.status==='finished').length;return `<section class="hero"><div><span class="eyebrow">${e(r.season)} / ${e(r.stage)}</span><h1>LA JORNADA SE JUEGA.<br><em>EL ORGULLO TAMBIÉN.</em></h1><p>Un grupo de amigos. Una jornada. Mil razones para presumir. Haz tus pronósticos y que hable la cancha.</p><span class="pill">${isClosed?'● Pronósticos cerrados':'● Jornada abierta'} · ${e(r.name)}</span></div><div class="deadline"><small>${isClosed?'LA SUERTE ESTÁ ECHADA':'CIERRE DE PRONÓSTICOS EN'}</small><div class="countdown" id="countdown"></div><small>${fmt(r.deadline)} · CDMX</small></div></section><div class="stats"><div class="stat"><small>Esta jornada</small><strong>${ms.length} partidos</strong></div><div class="stat"><small>Tu quiniela</small><strong>${count} / ${ms.length}</strong></div><div class="stat"><small>Partidos terminados</small><strong>${done} / ${ms.length}</strong></div><div class="stat"><small>Tu puntaje</small><strong>${rows.find(x=>x.id===user?.id)?.points||0} <small style="display:inline">puntos</small></strong></div></div>${complete(ms)?champion(rows,ms):''}<div class="layout"><section><div class="section-title"><h2>${isClosed?'Así va la jornada':'Elige a tus ganadores'}</h2><small>LOCAL · EMPATE · VISITANTE</small></div>${ms.map(m=>matchCard(m,isClosed)).join('')}${!isClosed?`<div class="savebar"><div><strong>${count===ms.length?'Tu quiniela está completa':`${count} de ${ms.length} pronósticos`}</strong><small>${dirty?'Tienes cambios sin guardar':'Puedes editar hasta el cierre de la jornada'}</small></div><button class="btn primary" id="save" ${busy||count!==ms.length||!ms.length?'disabled':''}>${busy?'Guardando…':'Guardar quiniela →'}</button></div>`:''}</section><aside><div class="card"><div class="section-title"><h3>La banda en la cancha</h3><span>↗</span></div><p class="muted">${isClosed?'Puntos por partidos terminados':'El historial de la temporada'}</p>${rankingList(isClosed?rows:ranks(data.matches))}<button class="btn full" data-tab="tabla" style="margin-top:12px">Ver clasificación completa →</button></div><div class="card rules"><span class="eyebrow">ASÍ SE JUEGA</span><h3 style="margin-top:14px">Aquí todos somos técnicos.</h3><ol><li>Elige local, empate o visitante.</li><li>Cada acierto suma un punto.</li><li>Cierre 24 h antes del primer partido.</li><li>Más puntos, más derecho a presumir.</li></ol><p class="muted">En liguilla: 90 minutos + compensación. Ida y vuelta cuentan por separado. Empates en puntos = victoria compartida.</p></div></aside></div>`}
function matchCard(m,isClosed){const result=outcome(m);return `<article class="match"><div class="match-head"><span>${fmt(m.kickoff)} · CDMX</span><span class="${m.status==='live'?'live':''}">${({scheduled:'POR JUGAR',live:'● EN JUEGO',finished:'FINALIZADO',postponed:'POSPUESTO',cancelled:'ANULADO'})[m.status]}</span></div><div class="versus"><div class="team">${badge(m.home)}<span>${e(m.home)}</span></div>${isClosed?`<div class="score">${m.home_score??'–'} : ${m.away_score??'–'}</div>`:`<div class="choices">${['L','E','V'].map(c=>`<button class="choice ${draft[m.id]===c?'selected':''}" data-pick="${e(m.id)}" data-choice="${c}" aria-label="${e(c==='L'?m.home:c==='V'?m.away:'Empate')}" aria-pressed="${draft[m.id]===c}">${c}</button>`).join('')}</div>`}<div class="team away"><span>${e(m.away)}</span>${badge(m.away)}</div></div>${isClosed?`<div class="match-foot">Tu pronóstico: ${draft[m.id]||'Sin registrar'} ${result&&draft[m.id]?(result===draft[m.id]?'· ✓ +1 punto':'· Sin acierto'):''}</div>`:''}</article>`}
function champion(rows,ms){return `<div class="champion"><span class="eyebrow">🏆 JORNADA FINALIZADA</span><h2>${!ms.some(m=>m.status==='finished')?'Jornada anulada':rows.length?`${winners(rows).map(x=>e(x.name)).join(' + ')} ${winners(rows).length>1?'ganaron':'ganó'} la jornada`:'Sin participantes'}</h2><span>${rows.length&&ms.some(m=>m.status==='finished')?`${rows[0].points} aciertos. El derecho a presumir es suyo.`:'No se asignan victorias.'}</span></div>`}
function tableView(r,ms){const rows=ranks();const total=ranks(data.matches);return `<div class="section-title"><div><span class="eyebrow">EL MARCADOR DE LA BANDA</span><h1 style="font-size:44px">Cada acierto cuenta.</h1></div><button class="btn" id="export">Descargar CSV ↓</button></div>${complete(ms)?champion(rows,ms):''}<div class="layout"><section><h2>${e(r.name)}</h2>${!closed(r)?'<div class="empty">Los pronósticos de todos se revelarán al cerrar la jornada.</div>':`<div class="table-wrap"><table><thead><tr><th>#</th><th>PARTICIPANTE</th><th>ACIERTOS</th>${ms.map(m=>`<th title="${e(m.home+' vs '+m.away)}">${e(m.home.slice(0,3))} / ${e(m.away.slice(0,3))}</th>`).join('')}</tr></thead><tbody>${rows.map((p,i)=>`<tr><td>${rows.findIndex(x=>x.points===p.points)+1}</td><td><strong>${e(p.name)}</strong></td><td>${p.points}</td>${ms.map(m=>{const pick=data.picks.find(x=>x.match_id===m.id&&x.user_id===p.id)?.choice;return `<td>${pick||'–'} ${pick&&outcome(m)===pick?'✓':''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}</section><aside class="card"><h3>Acumulado · todas las jornadas</h3>${total.map((p,i)=>{const wins=data.rounds.filter(r=>{const ms=data.matches.filter(m=>m.round_id===r.id);return complete(ms)&&ms.some(m=>m.status==='finished')&&winners(ranks(ms)).some(w=>w.id===p.id)}).length;return `<div class="rank-row"><span class="position">${total.findIndex(x=>x.points===p.points)+1}</span><span class="name">${e(p.name)}<br><small class="muted">${wins} jornadas ganadas</small></span><strong>${p.points}</strong></div>`}).join('')}<p class="muted">Aciertos acumulados de todos los torneos. Las victorias compartidas cuentan para cada ganador.</p></aside></div>`}
function history(){return `<span class="eyebrow">PARA QUE NADIE DIGA QUE NO SE ACUERDA</span><h1 style="font-size:48px">El historial de la banda.</h1><div class="history-grid">${data.rounds.map(r=>{const ms=data.matches.filter(m=>m.round_id===r.id),rows=ranks(ms),done=complete(ms);return `<button class="card" data-history="${e(r.id)}" style="text-align:left;color:inherit"><span class="pill">${done?'FINALIZADA':closed(r)?'EN CURSO':'ABIERTA'}</span><h2 style="margin:18px 0 5px">${e(r.name)}</h2><p class="muted">${e(r.season)} · ${e(r.stage)}</p><div class="progress"><i style="width:${ms.length?ms.filter(m=>['finished','cancelled'].includes(m.status)).length/ms.length*100:0}%"></i></div><h3>${done&&rows.length&&ms.some(m=>m.status==='finished')?'🏆 '+winners(rows).map(x=>e(x.name)).join(' + '):'Todo por decidir'}</h3><span class="muted">${ms.filter(m=>m.status==='finished').length} de ${ms.length} partidos terminados · Ver detalle →</span></button>`}).join('')}</div>`}
function admin(){return `<h1 style="font-size:44px">Detrás de la jornada.</h1><p class="muted">Publica el calendario completo. El cierre se calcula con el primer partido. Los resultados recalculan los puntos automáticamente.</p><div class="admin-grid"><form id="round-form" class="card fields"><h3>Nueva jornada</h3><label>Torneo<input name="season" required placeholder="Apertura 2026" maxlength="80"></label><label>Nombre<input name="name" required placeholder="Jornada 11" maxlength="80"></label><label>Fase<select name="stage"><option>Regular</option><option>Play-in</option><option>Cuartos · Ida</option><option>Cuartos · Vuelta</option><option>Semifinal · Ida</option><option>Semifinal · Vuelta</option><option>Final · Ida</option><option>Final · Vuelta</option></select></label><label>Partidos · uno por línea<textarea name="fixtures" required placeholder="América | Pumas | 2026-10-02T19:00:00-06:00 | 123456"></textarea></label><p class="muted">Formato: local | visitante | fecha ISO con zona horaria | ID API-Football (opcional). Verifica los horarios oficiales antes de publicar.</p><button class="btn dark">Publicar jornada →</button></form><div class="card"><h3>Resultados · ${e(round()?.name||'Sin jornada')}</h3><p class="muted">Marcador a 90 minutos. Marca Finalizado para asignar los puntos. Anulado excluye el encuentro.</p>${matches().map(m=>`<form class="admin-match" data-result="${e(m.id)}"><span>${e(m.home)} / ${e(m.away)}</span><input aria-label="Goles local" name="home" type="number" min="0" max="99" value="${m.home_score??''}"><input aria-label="Goles visitante" name="away" type="number" min="0" max="99" value="${m.away_score??''}"><select name="status" aria-label="Estado">${Object.entries({scheduled:'Programado',live:'En juego',finished:'Finalizado',postponed:'Pospuesto',cancelled:'Anulado'}).map(([v,n])=>`<option value="${v}" ${m.status===v?'selected':''}>${n}</option>`).join('')}</select><button class="btn" aria-label="Guardar resultado">✓</button></form>`).join('')}<p class="note">${demo?'Modo de prueba: puedes modificar los marcadores de la Jornada 9.':'La sincronización automática se configura en GitHub Actions. Los resultados manuales quedan protegidos de la sincronización.'}</p></div></div>`}
function tick(){const el=$('#countdown'),r=round();if(!el||!r)return;const t=Math.max(0,Date.parse(r.deadline)-Date.now());el.innerHTML=t?[[Math.floor(t/86400000),'DÍAS'],[Math.floor(t/3600000)%24,'HORAS'],[Math.floor(t/60000)%60,'MIN']].map(([v,l])=>`<span>${String(v).padStart(2,'0')}<small>${l}</small></span>`).join(''):'<span>CERRADA<small>QUE HABLE LA CANCHA</small></span>';if(!t&&document.querySelector('[data-pick]'))render()}
function persistDemo(){localStorage.setItem('lb-demo',JSON.stringify(data))}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#round-select').onchange=ev=>{if(dirty&&!confirm('Tienes cambios sin guardar. ¿Cambiar de jornada?')){ev.target.value=selected;return}dirty=false;selected=ev.target.value;restoreDraft();render()};$('#account').onclick=login;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(closed(round()))return render();draft[b.dataset.pick]=b.dataset.choice;dirty=true;render()});$('#save')?.addEventListener('click',save);document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{selected=b.dataset.history;tab='tabla';dirty=false;restoreDraft();render()});$('#round-form')?.addEventListener('submit',createRound);document.querySelectorAll('[data-result]').forEach(f=>f.onsubmit=updateResult);$('#export')?.addEventListener('click',exportCsv)}
function login(){const modal=$('#modal');if(user){modal.innerHTML=`<button class="close" aria-label="Cerrar">×</button><h2>${e(user.name)}</h2><p class="muted">Tu cuenta mantiene tus pronósticos vinculados a ti.</p><button class="btn" id="logout">Cerrar sesión</button>`;$('#logout').onclick=async()=>{try{if(!demo)await api('logout',{auth:true,method:'POST'});session=null;user=null;localStorage.removeItem('lb-session');localStorage.removeItem('lb-demo-user');dirty=false;modal.close();await load()}catch(err){toast(err.message)}}}else{modal.innerHTML=`<button class="close" aria-label="Cerrar">×</button><span class="eyebrow">BIENVENIDO A LA BANDA</span><h2 style="margin-top:16px">Aquí empieza la rivalidad.</h2><form id="login-form" class="fields"><label>Tu nombre<input name="name" required minlength="2" maxlength="40" autocomplete="nickname" placeholder="¿Cómo te dice la banda?"></label>${demo?'<p class="muted">Esta es una prueba local. Para participar con tus amigos, conecta el proyecto siguiendo el README.</p>':'<label>Correo<input name="email" type="email" required autocomplete="email"></label><label>Contraseña<input name="password" type="password" minlength="8" required autocomplete="current-password"></label>'}<div class="form-actions"><button class="btn dark" name="action" value="login">Entrar →</button>${demo?'':'<button class="btn" name="action" value="signup">Crear cuenta</button>'}</div></form>`;$('#login-form').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),button=ev.submitter;button.disabled=true;try{if(demo){user={id:crypto.randomUUID(),name:f.get('name').trim()};data.profiles.push(user);persistDemo();localStorage.setItem('lb-demo-user',JSON.stringify(user))}else{const signup=button.value==='signup',res=await api(signup?'signup':'token?grant_type=password',{auth:true,method:'POST',body:{email:f.get('email'),password:f.get('password'),...(signup?{data:{name:f.get('name').trim()}}:{})}});if(!res.access_token){toast('Revisa tu correo para confirmar la cuenta; después inicia sesión.');modal.close();return}session=res;localStorage.setItem('lb-session',JSON.stringify(res))}modal.close();await load();toast('Ya estás dentro. ¡Que gane el mejor!')}catch(err){toast(err.message)}finally{button.disabled=false}}}modal.querySelector('.close').onclick=()=>modal.close();modal.showModal()}
async function save(){if(!user)return login();if(closed(round()))return toast('El plazo de esta jornada terminó.');busy=true;render();try{const picks=matches().map(m=>({match_id:m.id,choice:draft[m.id]}));if(demo){data.picks=data.picks.filter(p=>!(p.user_id===user.id&&matches().some(m=>m.id===p.match_id)));data.picks.push(...picks.map(p=>({...p,user_id:user.id})));persistDemo()}else await api('rpc/submit_picks',{method:'POST',body:{p_round:selected,p_picks:picks}});dirty=false;await load();toast('✓ Quiniela guardada. ¡Ahora que hable la cancha!')}catch(err){toast(err.message)}finally{busy=false;render()}}
async function createRound(ev){ev.preventDefault();const f=new FormData(ev.target),button=ev.submitter;button.disabled=true;try{const fixtures=f.get('fixtures').trim().split('\n').map(line=>{const [home,away,kickoff,id]=line.split('|').map(x=>x.trim());if(!home||!away||home===away||!/(Z|[+-]\d\d:\d\d)$/.test(kickoff)||!Number.isFinite(Date.parse(kickoff))||(id&&!/^\d+$/.test(id)))throw Error('Revisa equipos, fecha con zona horaria e ID en cada línea.');return {home,away,kickoff,provider_id:id?Number(id):null}});const deadline=new Date(Math.min(...fixtures.map(m=>Date.parse(m.kickoff)))-86400000).toISOString();if(Date.parse(deadline)<=Date.now())throw Error('El primer partido debe ser dentro de más de 24 horas.');if(demo){const id=crypto.randomUUID();data.rounds.unshift({id,name:f.get('name'),season:f.get('season'),stage:f.get('stage'),deadline,published:true});data.matches.push(...fixtures.map(m=>({...m,id:crypto.randomUUID(),round_id:id,status:'scheduled',home_score:null,away_score:null})));selected=id;persistDemo()}else{selected=await api('rpc/create_round',{method:'POST',body:{p_name:f.get('name'),p_season:f.get('season'),p_stage:f.get('stage'),p_matches:fixtures}})}dirty=false;await load();toast('Jornada publicada. Cierre calculado automáticamente.')}catch(err){toast(err.message)}finally{button.disabled=false}}
async function updateResult(ev){ev.preventDefault();const f=new FormData(ev.target),id=ev.target.dataset.result,button=ev.submitter;const update={home_score:f.get('home')===''?null:Number(f.get('home')),away_score:f.get('away')===''?null:Number(f.get('away')),status:f.get('status'),manual_override:true,updated_at:new Date().toISOString()};if(update.status==='finished'&&(update.home_score===null||update.away_score===null))return toast('Captura ambos marcadores antes de finalizar.');button.disabled=true;try{if(demo){Object.assign(data.matches.find(m=>m.id===id),update);persistDemo()}else await api(`matches?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:update});await load();toast('Resultado actualizado. Puntos recalculados.')}catch(err){toast(err.message)}finally{button.disabled=false}}
function exportCsv(){const safe=s=>'"'+String(s).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const rows=ranks();const csv='\ufeff'+[['Participante','Aciertos'],...rows.map(x=>[x.name,x.points])].map(r=>r.map(safe).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='clasificacion.csv';a.click();URL.revokeObjectURL(a.href)}
window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue=''}});
load().catch(err=>{$('#app').innerHTML='<main><div class="empty"><h2>No pudimos cargar la quiniela</h2><p id="error-message"></p><button class="btn" onclick="location.reload()">Reintentar</button></div></main>';$('#error-message').textContent=err.message});setInterval(tick,1000);setInterval(()=>{if(!demo&&!dirty&&!busy&&!$('#modal').open)load().catch(err=>toast('No se actualizaron los datos: '+err.message))},60000);
</script></body></html>
